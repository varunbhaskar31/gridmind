[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gridmind"
version = "0.1.0"
description = "GridMind: Agentic Renewable Energy Orchestrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pulp>=2.8.0,<3.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "pydantic>=2.7.0",
    "google-genai>=0.1.1",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "pytest>=8.2.0",
]

[tool.setuptools.packages.find]
include = ["gridmind*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
